log.home: /data/logs/kele-doc
app.version: 1.0.0
loglevel: info
app.name: kele-doc
server:
  port: 9222
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200 # Maximum amount of worker threads.
      min-spare: 10 # Minimum amount of worker threads.
  error:
    path: /system/error

mybatis-plus:
  mapper-locations: classpath*:/mybatis/*.xml
  config-location: classpath:mybatis-config.xml

ty:
  doc:
    restTemplate:
      enable: true
      connectNum: 20
      keepAliveDuration: 300
      connectTimeout: 3
      readTimeout: 10
    docStorage:
      type: minio # 文档存储类型，目前已实现的有 dataBase，local，minio，oss，接口：com.kele.core.buz.doc.service.IDocFileContentStorageService
      path: ${app.name}/doc/content/ # 文档内容存储的位置，如果类型是 dataBase ，此属性无效
      minio:
        endpoint: http://kele-doc-minio:9000
        bucket: kele-doc
        accessKey: minio
        secretKey: Taeon@0727
    whiteUrlList: /api/login,/api/register # 白名单url，配置之后将会被登录拦截器拦截
    blackUrlList: /api/** # 黑名单url，配置之后将会被登录拦截器拦截
    fileUpload:
      type: minio # 文件上传类型，目前已实现local，minio，oss，接口 com.kele.core.buz.sys.service.ISysFileUploadService
      path: ${app.name}/attachment/ # 配置文件上传的地址
      minio:
        endpoint: http://kele-doc-minio:9000
        bucket: kele-doc
        accessKey: minio
        secretKey: Taeon@0727
    indexHtmlWebPath: /index.html # 配置欢迎页
    staticResources:
      - pathPatterns: /static/** # 配置静态资源访问的web uri
        resourceLocations: file:///${ty.doc.fileUpload.path} # 配置静态资源所在物理磁盘的位置，不过静态资源的访问尽量使用 nginx 反向代理
      - pathPatterns: /**
        resourceLocations: classpath:/static/kele-doc/
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  application.name: ${app.name}
  mvc:
    format:
      date-time: "yyyy-MM-dd HH:mm:ss"
    dispatch-trace-request: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
    #https://www.cnblogs.com/woshimrf/p/LocalDate-serialize-json-springboot.html
    serialization.WRITE_DATES_AS_TIMESTAMPS: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      stat-view-servlet.enabled: false
      web-stat-filter.enabled: false
      filters: stat
      maxActive: 20
      initialSize: 1
      maxWait: 60000
      minIdle: 1
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      validationQuery: select 'x'
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      poolPreparedStatements: true
      maxPoolPreparedStatementPerConnectionSize: 20
      maxOpenPreparedStatements: 20
      useGlobalDataSourceStat: false
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=1000;druid.stat.logSlowSql=true
      url: jdbc:mysql://kele-doc-mysql:3306/kele-doc?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true
      username: root
      password: Taeon@0727
  redis:
    host: kele-doc-redis
    port: 6379
    password: Taeon@0727
    database: 0  # 默认数据库索引
    lettuce:
      pool:
        max-active: 30
        min-idle: 8
        max-idle: 20
        time-between-eviction-runs: 30000
