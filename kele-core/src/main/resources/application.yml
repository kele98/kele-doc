log.home: /data/logs/kele-doc
app.version: 1.0.0
loglevel: info
app.name: kele-doc
server:
  port: 9222
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200 # Maximum amount of worker threads.
      min-spare: 10 # Minimum amount of worker threads.
  error:
    path: /system/error

mybatis-plus:
  mapper-locations: classpath*:/mybatis/*.xml
  config-location: classpath:mybatis-config.xml

kele:
  doc:
    restTemplate:
      enable: true
      connectNum: 20
      keepAliveDuration: 300
      connectTimeout: 3
      readTimeout: 10
    docStorage:
      type: minio # 文档存储类型，目前已实现的有 dataBase，local，minio，oss，接口：com.kele.core.buz.doc.service.IDocFileContentStorageService
      path: doc/content/ # 文档内容存储的位置，如果类型是 dataBase ，此属性无效
      minio:
        endpoint: http://localhost:19000
        bucket: test
        accessKey: minio
        secretKey: Taeon@123
    whiteUrlList: /api/login # 白名单url，配置之后将会被登录拦截器拦截
    blackUrlList: /api/** # 黑名单url，配置之后将会被登录拦截器拦截
    fileUpload:
      type: minio # 文件上传类型，目前已实现local，minio，oss，接口 com.kele.core.buz.sys.service.ISysFileUploadService
      path: attachment/ # 配置文件上传的地址
      minio:
        endpoint: http://localhost:19000
        bucket: test
        accessKey: minio
        secretKey: Taeon@123
    indexHtmlWebPath: /index.html # 配置欢迎页
    staticResources:
      - pathPatterns: /static/** # 配置静态资源访问的web uri
        resourceLocations: file:///${kele.doc.fileUpload.path} # 配置静态资源所在物理磁盘的位置，不过静态资源的访问尽量使用 nginx 反向代理
      - pathPatterns: /**
        resourceLocations: classpath:/static/kele-doc/
    # v0.6 B3: 启动期校验 sys_user_info.id=1 存在且 role=ADMIN
    startup:
      admin-check:
        enabled: true
    # v0.13 #16: 权限引擎实现切换（单一三态开关，避免双开关错配导致启动失败或 UOE）
    # app-walk（默认）：app-layer walk（PermissionService.java，spec §5.2）
    # cte：CTE 主路径（PermissionServiceCtePrimary.java，spec §5.3；目前为 stub，未实现）
    permission:
      engine: app-walk
    # #18: createFile / copyFile 失败留下的 DISPLAY 残留孤儿清理
    # 24h 阈值：正常流程几秒内就从 DISPLAY 翻 NORMAL，能撑过 threshold 的几乎确定是孤儿
    cleanup:
      display:
        enabled: true
        threshold-hours: 24
        cron: "0 0 3 * * ?" # 每天凌晨 3 点
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  application.name: ${app.name}
  # Flyway (V2__sharing.sql migration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  mvc:
    format:
      date-time: "yyyy-MM-dd HH:mm:ss"
    dispatch-trace-request: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
    #https://www.cnblogs.com/woshimrf/p/LocalDate-serialize-json-springboot.html
    serialization.WRITE_DATES_AS_TIMESTAMPS: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      stat-view-servlet.enabled: false
      web-stat-filter.enabled: false
      filters: stat
      maxActive: 20
      initialSize: 1
      maxWait: 60000
      minIdle: 1
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      validationQuery: select 'x'
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      poolPreparedStatements: true
      maxPoolPreparedStatementPerConnectionSize: 20
      maxOpenPreparedStatements: 20
      useGlobalDataSourceStat: false
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=1000;druid.stat.logSlowSql=true
      url: jdbc:mysql://localhost:13306/kele_doc?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true
      username: root
      password: Taeon@123
  redis:
    host: localhost
    port: 6379
    database: 0  # 默认数据库索引
    lettuce:
      pool:
        max-active: 30
        min-idle: 8
        max-idle: 20
        time-between-eviction-runs: 30000
    password: